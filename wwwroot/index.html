<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Numeria</title>
    <base href="/" />
    <link rel="stylesheet" href="css/site.css" />
    <link id="theme-css" rel="stylesheet" href="css/themes/dark.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="numeria-icon.svg" />
</head>

<body>
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
        justify-content:center;align-items:center;
        background:#0c0e1a;
        font-family:'Cinzel',Georgia,serif;
        transition:opacity 0.5s ease;opacity:1;overflow:hidden;">

        <!-- Animated grid background -->
        <div style="position:absolute;inset:0;
            background-image:
                linear-gradient(rgba(74,95,224,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74,95,224,0.06) 1px, transparent 1px);
            background-size:40px 40px;
            animation:gridPulse 4s ease-in-out infinite;">
        </div>

        <!-- Radial glow -->
        <div style="position:absolute;width:500px;height:500px;
            background:radial-gradient(circle, rgba(74,95,224,0.15) 0%, rgba(180,140,255,0.08) 40%, transparent 70%);
            border-radius:50%;animation:glowPulse 3s ease-in-out infinite;">
        </div>

        <!-- Orbiting math symbols -->
        <div class="orbit-ring" style="position:absolute;width:280px;height:280px;">
            <div class="orbit-symbol" style="--delay:0s;--angle:0deg;">&#x03C0;</div>
            <div class="orbit-symbol" style="--delay:-2.5s;--angle:60deg;">&#x222B;</div>
            <div class="orbit-symbol" style="--delay:-5s;--angle:120deg;">&#x221E;</div>
            <div class="orbit-symbol" style="--delay:-7.5s;--angle:180deg;">&#x2211;</div>
            <div class="orbit-symbol" style="--delay:-10s;--angle:240deg;">&#x0394;</div>
            <div class="orbit-symbol" style="--delay:-12.5s;--angle:300deg;">&#x03C6;</div>
        </div>

        <!-- Logo -->
        <div style="position:relative;animation:splashLogo 0.8s cubic-bezier(0.34,1.56,0.64,1) both;">
            <div style="position:absolute;inset:-8px;border-radius:28px;
                background:linear-gradient(135deg,#4a5fe0,#b48cff,#ff8ec6,#4a5fe0);
                background-size:300% 300%;animation:borderGlow 3s ease infinite;opacity:0.7;filter:blur(2px);">
            </div>
            <img src="numeria-icon.svg" alt="" style="position:relative;width:100px;height:100px;border-radius:24px;
                box-shadow:0 12px 48px rgba(74,95,224,0.3);" />
        </div>

        <!-- App name -->
        <div style="position:relative;margin-top:28px;font-size:2.6rem;font-weight:700;letter-spacing:0.12em;
            background:linear-gradient(90deg,#7eb4ff,#b48cff,#ff8ec6,#7eb4ff);
            background-size:200% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;
            animation:splashName 0.6s ease 0.3s both,shimmer 2.5s linear 0.9s infinite;">
            NUMERIA
        </div>

        <!-- Tagline -->
        <div style="position:relative;margin-top:10px;color:rgba(180,200,255,0.4);font-size:0.8rem;font-weight:400;
            letter-spacing:3px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            animation:splashTag 0.5s ease 0.6s both;">
            EXPLORE MATHEMATICS
        </div>

        <!-- Loading bar -->
        <div style="position:relative;margin-top:44px;width:120px;height:3px;
            background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;
            animation:splashLoader 0.4s ease 0.8s both;">
            <div style="width:100%;height:100%;
                background:linear-gradient(90deg,transparent,#4a5fe0,#b48cff,transparent);
                animation:loadSlide 1.5s ease-in-out infinite;">
            </div>
        </div>

        <style>
            @keyframes shimmer { to { background-position: 200% center; } }
            @keyframes splashLogo { from { opacity:0; transform:scale(0.5) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
            @keyframes splashName { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
            @keyframes splashTag { from { opacity:0; } to { opacity:1; } }
            @keyframes splashLoader { from { opacity:0; } to { opacity:1; } }
            @keyframes glowPulse { 0%,100% { transform:scale(1);opacity:1; } 50% { transform:scale(1.1);opacity:0.7; } }
            @keyframes gridPulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
            @keyframes borderGlow { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
            @keyframes loadSlide { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
            @keyframes orbitSpin { from { transform:rotate(var(--angle)); } to { transform:rotate(calc(var(--angle) + 360deg)); } }

            .orbit-ring {
                animation: ringRotate 15s linear infinite;
            }
            @keyframes ringRotate { to { transform:rotate(360deg); } }

            .orbit-symbol {
                position:absolute;
                font-family:Georgia,'Times New Roman',serif;
                font-size:1.3rem;
                color:rgba(180,200,255,0.12);
                animation:symbolFade 5s ease-in-out infinite;
                animation-delay:var(--delay);
            }
            .orbit-symbol:nth-child(1) { top:0;left:50%;transform:translateX(-50%); }
            .orbit-symbol:nth-child(2) { top:18%;right:3%; }
            .orbit-symbol:nth-child(3) { bottom:18%;right:3%; }
            .orbit-symbol:nth-child(4) { bottom:0;left:50%;transform:translateX(-50%); }
            .orbit-symbol:nth-child(5) { bottom:18%;left:3%; }
            .orbit-symbol:nth-child(6) { top:18%;left:3%; }

            @keyframes symbolFade { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
        </style>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#x1F5D9;</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="js/mathCanvas.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/topicGraph.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/tts.js"></script>
    <script>
        // Theme management
        function applyTheme(themeId) {
            var link = document.getElementById('theme-css');
            if (themeId && themeId !== 'default') {
                link.href = 'css/themes/' + themeId + '.css';
            } else {
                link.href = '';
            }
        }

        // Font size management
        function applyFontSize(size) {
            document.documentElement.classList.remove('font-small', 'font-medium', 'font-large');
            if (size) {
                document.documentElement.classList.add('font-' + size);
            }
        }

        // Apply saved font size immediately
        (function() {
            try {
                var profile = JSON.parse(localStorage.getItem('mathvoyager_profile'));
                if (profile && profile.fontSize) {
                    applyFontSize(profile.fontSize);
                }
            } catch(e) {}
        })();

        // Data export
        function exportProfileData() {
            var data = localStorage.getItem('mathvoyager_profile');
            if (!data) return null;
            return data;
        }

        // Data import
        function importProfileData(json) {
            try {
                JSON.parse(json); // validate
                localStorage.setItem('mathvoyager_profile', json);
                return true;
            } catch(e) {
                return false;
            }
        }

        // File download helper
        function downloadFile(filename, content) {
            var blob = new Blob([content], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // File upload helper — returns a Promise<string>
        function pickAndReadFile() {
            return new Promise(function(resolve, reject) {
                var input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = function(e) {
                    var file = e.target.files[0];
                    if (!file) { reject('No file'); return; }
                    var reader = new FileReader();
                    reader.onload = function(ev) { resolve(ev.target.result); };
                    reader.onerror = function() { reject('Read error'); };
                    reader.readAsText(file);
                };
                input.click();
            });
        }

        // KaTeX rendering
        function renderMath(elementId, expression, displayMode) {
            var el = document.getElementById(elementId);
            if (el) {
                katex.render(expression, el, {
                    throwOnError: false,
                    displayMode: displayMode !== false
                });
            }
        }

        // Toast notifications
        var toastCounter = 0;
        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }

        // Share card renderer
        function drawShareCard(opts) {
            var c = document.getElementById('share-canvas');
            if (!c) return;
            var ctx = c.getContext('2d');
            var w = 600, h = 400;

            // Background gradient
            var grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, opts.bg1);
            grad.addColorStop(1, opts.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Decorative circles
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = opts.accent;
            ctx.beginPath(); ctx.arc(w * 0.85, h * 0.15, 120, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(w * 0.1, h * 0.9, 80, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;

            // App name
            ctx.fillStyle = opts.accent;
            ctx.font = 'bold 14px system-ui';
            ctx.fillText('NUMERIA', 30, 36);

            // User name
            ctx.fillStyle = opts.textColor;
            ctx.font = 'bold 28px system-ui';
            ctx.fillText(opts.name, 30, 80);

            // Level badge
            ctx.font = 'bold 16px system-ui';
            ctx.fillStyle = opts.accent;
            ctx.fillText('Level ' + opts.level, 30, 108);

            // Divider line
            ctx.strokeStyle = opts.accent;
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(30, 125); ctx.lineTo(w - 30, 125); ctx.stroke();
            ctx.globalAlpha = 1;

            // Stats grid
            var stats = [
                [opts.xp.toLocaleString(), 'Total XP'],
                [opts.streak + ' days', 'Streak'],
                [opts.lessons + '/' + opts.lessonTotal, 'Lessons'],
                [opts.topics + '/' + opts.topicCount, 'Topics'],
                [opts.quizzes.toString(), 'Quizzes'],
                [opts.accuracy + '%', 'Accuracy']
            ];

            var cols = 3, rows = 2;
            var cellW = (w - 60) / cols;
            var cellH = 65;
            var startY = 145;

            for (var i = 0; i < stats.length; i++) {
                var col = i % cols;
                var row = Math.floor(i / cols);
                var x = 30 + col * cellW;
                var y = startY + row * cellH;

                // Stat value
                ctx.fillStyle = opts.textColor;
                ctx.font = 'bold 22px system-ui';
                ctx.fillText(stats[i][0], x, y + 25);

                // Stat label
                ctx.fillStyle = opts.accent;
                ctx.globalAlpha = 0.7;
                ctx.font = '12px system-ui';
                ctx.fillText(stats[i][1], x, y + 42);
                ctx.globalAlpha = 1;
            }

            // Achievements count
            var achY = startY + rows * cellH + 15;
            ctx.fillStyle = opts.accent;
            ctx.font = 'bold 14px system-ui';
            ctx.fillText(opts.achievements + ' achievements unlocked', 30, achY);

            // XP progress bar
            var barY = achY + 20;
            var barW = w - 60;
            ctx.fillStyle = opts.textColor;
            ctx.globalAlpha = 0.1;
            ctx.fillRect(30, barY, barW, 8);
            ctx.globalAlpha = 1;
            ctx.fillStyle = opts.accent;
            var pct = Math.min(opts.lessons / Math.max(opts.lessonTotal, 1), 1);
            ctx.fillRect(30, barY, barW * pct, 8);

            // Footer
            ctx.fillStyle = opts.textColor;
            ctx.globalAlpha = 0.4;
            ctx.font = '11px system-ui';
            ctx.fillText('Longest streak: ' + opts.longestStreak + ' days', 30, h - 20);
            ctx.textAlign = 'right';
            ctx.fillText('numeria.app', w - 30, h - 20);
            ctx.textAlign = 'left';
            ctx.globalAlpha = 1;
        }

        async function copyCanvasToClipboard(canvasId) {
            var c = document.getElementById(canvasId);
            if (!c) return;
            var blob = await new Promise(function(resolve) { c.toBlob(resolve, 'image/png'); });
            if (blob && navigator.clipboard && navigator.clipboard.write) {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
            } else {
                throw new Error('Clipboard API not available');
            }
        }
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start().then(function () {
            var splash = document.getElementById('splash');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(function () { splash.remove(); }, 500);
            }
        });
    </script>
</body>

</html>
