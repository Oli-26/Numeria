<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MathVoyager</title>
    <base href="/" />
    <link rel="stylesheet" href="css/site.css" />
    <link id="theme-css" rel="stylesheet" href="" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MathVoyager.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;color:var(--text-muted);">
            Loading MathVoyager...
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#x1F5D9;</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="js/mathCanvas.js"></script>
    <script>
        // Theme management
        function applyTheme(themeId) {
            var link = document.getElementById('theme-css');
            if (themeId && themeId !== 'default') {
                link.href = 'css/themes/' + themeId + '.css';
            } else {
                link.href = '';
            }
        }

        // KaTeX rendering
        function renderMath(elementId, expression, displayMode) {
            var el = document.getElementById(elementId);
            if (el) {
                katex.render(expression, el, {
                    throwOnError: false,
                    displayMode: displayMode !== false
                });
            }
        }

        // Toast notifications
        var toastCounter = 0;
        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
