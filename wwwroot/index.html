        <style>
            #splash {
                position: fixed; inset: 0; z-index: 9999;
                display: flex; flex-direction: column; justify-content: center; align-items: center;
                background: var(--bg-main, #F4EFE6);
                transition: opacity 0.5s ease; opacity: 1; overflow: hidden;

            .splash-mark { width: 112px; height: auto; overflow: visible; }
            .splash-rings { animation: splashFade 0.5s ease both; }
            .splash-thread { stroke-dasharray: 1 2; animation: splashThread 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s both; }
            .splash-ball { transform-origin: 512px 512px; animation: splashBall 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s both; }

                animation: splashFade 0.6s ease 0.8s both;

            .splash-loader {

                background: var(--border, #DDD3C4); animation: splashFade 0.4s ease 1.2s both;

            .splash-loader div {
                width: 100%; height: 100%;
                background: linear-gradient(90deg, transparent, #C8643B, transparent);

            @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }
            @keyframes splashThread { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

    <script>
        // Capacitor native polish: runs once if Capacitor is present.
        (function () {
            if (!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;

            // Status bar colour and icon style follow the theme: see syncStatusBar.
            try {
                var sb = window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar;
                if (sb && sb.setOverlaysWebView) sb.setOverlaysWebView({ overlay: false }).catch(function () { });
            } catch (e) { }

            // Hardware back: pop history; minimize on root.
            try {
                var app = window.Capacitor.Plugins && window.Capacitor.Plugins.App;
                if (app && app.addListener) {
                    app.addListener('backButton', function () {
                        if (window.NousSheet && window.NousSheet.isOpen) {
                            window.NousSheet.requestClose();
                            return;
                        }
                        var atRoot = window.location.pathname === '/' || window.location.pathname === '';
                        if (!atRoot && window.history.length > 1) {
                            window.history.back();
                        } else if (app.minimizeApp) {
                            app.minimizeApp();
                        } else if (app.exitApp) {
                            app.exitApp();
                        }
                    });
                }
            } catch (e) { }

            // nous:// deep links: fired by long-press shortcuts and external
            // intents. Translate nous://review -> /review, stash for cold-start
            // consumption, dispatch event for warm taps.
            function _handleNousUrl(url) {
                if (!url) return;
                var m = /^nous:\/\/([^?#]*)/i.exec(url);
                if (!m) return;
                var route = '/' + (m[1] || '').replace(/^\/+/, '');
                try { sessionStorage.setItem('nous_pending_deeplink', route); } catch (e) { }
                try { window.dispatchEvent(new CustomEvent('nous:deeplink', { detail: route })); } catch (e) { }
            }
            try {
                var app2 = window.Capacitor.Plugins && window.Capacitor.Plugins.App;
                if (app2) {
                    if (app2.addListener) {
                        app2.addListener('appUrlOpen', function (data) { _handleNousUrl(data && data.url); });
                    }
                    if (app2.getLaunchUrl) {
                        app2.getLaunchUrl().then(function (res) { if (res && res.url) _handleNousUrl(res.url); }).catch(function () { });
                    }
                }
            } catch (e) { }
        })();
    </script>
    <script>
        // Theme management
        function applyTheme(themeId) {
            var link = document.getElementById('theme-css');
            link.onload = syncStatusBar;
            if (themeId && themeId !== 'default') {
                link.href = 'css/themes/' + themeId + '.css';
            } else {
                link.href = 'css/themes/nous.css';
            }
        }

        // Browser theme-color and the native status bar take the active theme's background.
        function syncStatusBar() {
            var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-main').trim() || '#F4EFE6';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', bg);
            var cap = window.Capacitor;
            var sb = cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.StatusBar;
            if (!sb) return;
            var m = /^#([0-9a-f]{6})$/i.exec(bg);
            var n = m ? parseInt(m[1], 16) : 0xF4EFE6;
            var luma = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
            // Capacitor's LIGHT style means dark icons, for light backgrounds.
            sb.setStyle && sb.setStyle({ style: luma > 140 ? 'LIGHT' : 'DARK' }).catch(function () { });
            sb.setBackgroundColor && sb.setBackgroundColor({ color: bg }).catch(function () { });
        }

        // Font size management
        function applyFontSize(size) {
            document.documentElement.classList.remove('font-small', 'font-medium', 'font-large');
            if (size) {
                document.documentElement.classList.add('font-' + size);
            }
        }

        // Domain hue
        function applyDomain(domainId) {
            if (domainId) {
                document.documentElement.setAttribute('data-domain', domainId);
            } else {
                document.documentElement.removeAttribute('data-domain');
            }
        }

        // Card frame skin
        function applyFrame(frameId) {
            if (frameId) {
                document.documentElement.setAttribute('data-frame', frameId);
            } else {
                document.documentElement.removeAttribute('data-frame');
            }
        }

        // Streak flame skin
        function applyFlame(flameId) {
            if (flameId) {
                document.documentElement.setAttribute('data-flame', flameId);
            } else {
                document.documentElement.removeAttribute('data-flame');
            }
        }

        // Apply saved theme + font size + domain + cosmetics immediately
        (function() {
            try {
                var profile = JSON.parse(localStorage.getItem('mathvoyager_profile'));
                if (profile) {
                    if (profile.selectedTheme) applyTheme(profile.selectedTheme);
                    if (profile.fontSize) applyFontSize(profile.fontSize);
                    if (profile.currentDomain) applyDomain(profile.currentDomain);
                    if (profile.selectedFrame) applyFrame(profile.selectedFrame);
                    if (profile.selectedFlame) applyFlame(profile.selectedFlame);
                }
            } catch(e) {}
            syncStatusBar();
        })();

        // Data export
        function exportProfileData() {
            var data = localStorage.getItem('mathvoyager_profile');
            if (!data) return null;
            return data;
        }

        // Data import
        function importProfileData(json) {
            try {
                var data = JSON.parse(json);
                // Must be a profile object, not an array/primitive, and carry
                // fields every real export has (see UserProfile.cs).
                if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
                if (typeof data.displayName !== 'string' || typeof data.totalXp !== 'number') return false;
                localStorage.setItem('mathvoyager_profile', json);
                return true;
            } catch(e) {
                return false;
            }
        }

        // Text backups are gzipped so they survive note apps and keyboards that cap pasted text
        // (Google Keep stops at 20,000 characters). gzip's CRC also catches a cut-off paste.
        var BACKUP_PREFIX = 'NOUS1:';

        async function exportBackupText() {
            var json = exportProfileData();
            if (!json) return null;
            var gz = new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
            var bin = '';
            for (var i = 0; i < gz.length; i += 0x8000) bin += String.fromCharCode.apply(null, gz.subarray(i, i + 0x8000));
            return BACKUP_PREFIX + btoa(bin);
        }

        // Returns 'ok', 'cut' (incomplete paste) or 'invalid'.
        async function importBackupText(text) {
            text = (text || '').trim();
            var at = text.indexOf(BACKUP_PREFIX);
            if (at < 0) {
                if (importProfileData(text)) return 'ok';
                return text.charAt(0) === '{' ? 'cut' : 'invalid';
            }
            var json;
            try {
                var bin = atob(text.slice(at + BACKUP_PREFIX.length).replace(/[^A-Za-z0-9+/=]/g, ''));
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                json = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
            } catch (e) {
                return 'cut';
            }
            return importProfileData(json) ? 'ok' : 'invalid';
        }

        // Play's in-app review sheet; false on the web or when the plugin is missing.
        async function requestStoreReview() {
            var cap = window.Capacitor;
            var review = cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.InAppReview;
            if (!review) return false;
            try { await review.requestReview(); return true; }
            catch (e) { return false; }
        }

        // 'native' inside the Android app; otherwise which install prompt suits this browser.
        function nousPlatform() {
            var cap = window.Capacitor;
            if (cap && cap.isNativePlatform && cap.isNativePlatform()) return 'native';
            var ua = navigator.userAgent || '';
            if (/android/i.test(ua)) return 'android';
            if (/iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                var installed = navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
                return installed ? 'ios-installed' : 'ios';
            }
            return 'desktop';
        }

        function nativeClipboard() {
            var cap = window.Capacitor;
            return cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Clipboard;
        }

        async function clipboardWrite(text) {
            var clip = nativeClipboard();
            if (clip) await clip.write({ string: text });
            else await navigator.clipboard.writeText(text);
        }

        async function clipboardRead() {
            var clip = nativeClipboard();
            return clip ? ((await clip.read()).value || '') : await navigator.clipboard.readText();
        }

        // File download helper. On Capacitor (Android), <a download> is blocked
        // by the WebView, so write to Cache via Filesystem then open the share
        // sheet so the user can save to Drive/Downloads/email.
        async function downloadFile(filename, content) {
            var isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
            if (isNative) {
                var share = window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
                if (share) {
                    try {
                        var file = new File([content], filename, { type: 'application/json' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: 'Nous backup',
                                files: [file]
                            });
                        } else {
                            await share.share({
                                title: 'Nous backup',
                                text: content,
                                dialogTitle: 'Save backup'
                            });
                        }
                    } catch (e) {
                        // User cancelled share sheet: not an error.
                    }
                    return;
                }
            }
            var blob = new Blob([content], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // File upload helper: returns a Promise<string>
        function pickAndReadFile() {
            return new Promise(function(resolve, reject) {
                var input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,.txt,application/json,text/plain';
                input.onchange = function(e) {
                    var file = e.target.files[0];
                    if (!file) { reject('No file'); return; }
                    var reader = new FileReader();
                    reader.onload = function(ev) { resolve(ev.target.result); };
                    reader.onerror = function() { reject('Read error'); };
                    reader.readAsText(file);
                };
                input.click();
            });
        }

        // KaTeX is bundled and fetched on the first formula, so startup never waits on it (or on the network).
        var katexReady = null;
        function loadKatex() {
            if (window.katex) return Promise.resolve();
            if (katexReady) return katexReady;
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'lib/katex/katex.min.css';
            document.head.appendChild(css);
            katexReady = new Promise(function(resolve, reject) {
                var s = document.createElement('script');
                s.src = 'lib/katex/katex.min.js';
                s.onload = resolve;
                s.onerror = function() { katexReady = null; reject(); };
                document.head.appendChild(s);
            });
            return katexReady;
        }

        async function renderMath(elementId, expression, displayMode) {
            await loadKatex();
            var el = document.getElementById(elementId);
            if (el) {
                katex.render(expression, el, {
                    throwOnError: false,
                    displayMode: displayMode !== false
                });
            }
        }

        // Typesets \( \), \[ \] and $$ $$ maths inside lesson text. A single $ is left alone so prices stay prices.
        // Once rendered the delimiters are gone, so calling this again on the same element does nothing.
        var MATH_IN_TEXT = /\\\(([\s\S]+?)\\\)|\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$/g;
        async function renderMathIn(elementId) {
            var root = document.getElementById(elementId);
            if (!root || !/\\\(|\\\[|\$\$/.test(root.textContent)) return;
            await loadKatex();
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            var nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(function (node) {
                var text = node.nodeValue, last = 0, m;
                MATH_IN_TEXT.lastIndex = 0;
                if (!MATH_IN_TEXT.test(text)) return;
                MATH_IN_TEXT.lastIndex = 0;
                var frag = document.createDocumentFragment();
                while ((m = MATH_IN_TEXT.exec(text))) {
                    frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                    var span = document.createElement('span');
                    katex.render(m[1] || m[2] || m[3], span, { throwOnError: false, displayMode: m[1] === undefined });
                    frag.appendChild(span);
                    last = MATH_IN_TEXT.lastIndex;
                    // Chrome will break a line between KaTeX's inline-block output and the punctuation after it,
                    // so move that punctuation inside the formula's last box (restyled as body text).
                    var punct = /^[.,;:!?)]+/.exec(text.slice(last));
                    var bases = span.querySelectorAll('.katex-html > .base');
                    if (punct && bases.length) {
                        var tail = document.createElement('span');
                        tail.className = 'math-punct';
                        tail.textContent = punct[0];
                        bases[bases.length - 1].appendChild(tail);
                        last += punct[0].length;
                        MATH_IN_TEXT.lastIndex = last;
                    }
                }
                frag.appendChild(document.createTextNode(text.slice(last)));
                node.parentNode.replaceChild(frag, node);
            });
        }

        // Toast notifications
        var toastCounter = 0;
        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }

        // Share card renderer
        function drawShareCard(opts) {
            var c = document.getElementById('share-canvas');
            if (!c) return;
            var ctx = c.getContext('2d');
            var w = 600, h = 400;

            // Background gradient
            var grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, opts.bg1);
            grad.addColorStop(1, opts.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Decorative circles
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = opts.accent;
            ctx.beginPath(); ctx.arc(w * 0.85, h * 0.15, 120, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(w * 0.1, h * 0.9, 80, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;

            // App name
            ctx.fillStyle = opts.accent;
            ctx.font = 'bold 14px system-ui';
            ctx.fillText('NOUS', 30, 36);

            // User name
            ctx.fillStyle = opts.textColor;
            ctx.font = 'bold 28px system-ui';
            ctx.fillText(opts.name, 30, 80);

            // Level badge
            ctx.font = 'bold 16px system-ui';
            ctx.fillStyle = opts.accent;
            ctx.fillText('Level ' + opts.level, 30, 108);

            // Divider line
            ctx.strokeStyle = opts.accent;
            ctx.globalAlpha = 0.3;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(30, 125); ctx.lineTo(w - 30, 125); ctx.stroke();
            ctx.globalAlpha = 1;

            // Stats grid
            var stats = [
                [opts.xp.toLocaleString(), 'Total XP'],
                [opts.streak + ' days', 'Streak'],
                [opts.lessons + '/' + opts.lessonTotal, 'Lessons'],
                [opts.topics + '/' + opts.topicCount, 'Topics'],
                [opts.quizzes.toString(), 'Quizzes'],
                [opts.accuracy + '%', 'Accuracy']
            ];

            var cols = 3, rows = 2;
            var cellW = (w - 60) / cols;
            var cellH = 65;
            var startY = 145;

            for (var i = 0; i < stats.length; i++) {
                var col = i % cols;
                var row = Math.floor(i / cols);
                var x = 30 + col * cellW;
                var y = startY + row * cellH;

                // Stat value
                ctx.fillStyle = opts.textColor;
                ctx.font = 'bold 22px system-ui';
                ctx.fillText(stats[i][0], x, y + 25);

                // Stat label
                ctx.fillStyle = opts.accent;
                ctx.globalAlpha = 0.7;
                ctx.font = '12px system-ui';
                ctx.fillText(stats[i][1], x, y + 42);
                ctx.globalAlpha = 1;
            }

            // Achievements count
            var achY = startY + rows * cellH + 15;
            ctx.fillStyle = opts.accent;
            ctx.font = 'bold 14px system-ui';
            ctx.fillText(opts.achievements + ' achievements unlocked', 30, achY);

            // XP progress bar
            var barY = achY + 20;
            var barW = w - 60;
            ctx.fillStyle = opts.textColor;
            ctx.globalAlpha = 0.1;
            ctx.fillRect(30, barY, barW, 8);
            ctx.globalAlpha = 1;
            ctx.fillStyle = opts.accent;
            var pct = Math.min(opts.lessons / Math.max(opts.lessonTotal, 1), 1);
            ctx.fillRect(30, barY, barW * pct, 8);

            // Footer
            ctx.fillStyle = opts.textColor;
            ctx.globalAlpha = 0.4;
            ctx.font = '11px system-ui';
            ctx.fillText('Longest streak: ' + opts.longestStreak + ' days', 30, h - 20);
            ctx.textAlign = 'right';
            ctx.fillText('nous.app', w - 30, h - 20);
            ctx.textAlign = 'left';
            ctx.globalAlpha = 1;
        }

        async function copyCanvasToClipboard(canvasId) {
            var c = document.getElementById(canvasId);
            if (!c) return;
            var blob = await new Promise(function(resolve) { c.toBlob(resolve, 'image/png'); });
            if (!blob) return;
            try {
                if (typeof ClipboardItem !== 'undefined' && navigator.clipboard && navigator.clipboard.write) {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                } else {
                    await NousShare.shareCanvas(canvasId, 'Nous', '');
                }
            } catch (e) {
                await NousShare.shareCanvas(canvasId, 'Nous', '');
            }
        }
    </script>

        Blazor.start().then(function () {
            var splash = document.getElementById('splash');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(function () { splash.remove(); }, 500);
            }
        });
    </script>
