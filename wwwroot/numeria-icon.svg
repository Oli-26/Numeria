<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1a8a"/>
      <stop offset="50%" stop-color="#6b2fb5"/>
      <stop offset="100%" stop-color="#8b45d6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb4ff"/>
      <stop offset="50%" stop-color="#b48cff"/>
      <stop offset="100%" stop-color="#ff8ec6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b48cff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle grid pattern for math feel -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="112" y1="16" x2="112" y2="496"/>
    <line x1="208" y1="16" x2="208" y2="496"/>
    <line x1="304" y1="16" x2="304" y2="496"/>
    <line x1="400" y1="16" x2="400" y2="496"/>
    <line x1="16" y1="112" x2="496" y2="112"/>
    <line x1="16" y1="208" x2="496" y2="208"/>
    <line x1="16" y1="304" x2="496" y2="304"/>
    <line x1="16" y1="400" x2="496" y2="400"/>
  </g>

  <!-- Orbital ring -->
  <ellipse cx="256" cy="256" rx="155" ry="155" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.5"/>

  <!-- Floating math symbols -->
  <g fill="#fff" opacity="0.15" font-family="Georgia, serif">
    <text x="90" y="140" font-size="36">+</text>
    <text x="390" y="150" font-size="32" transform="rotate(15, 390, 150)">&#x3C0;</text>
    <text x="100" y="390" font-size="30" transform="rotate(-10, 100, 390)">&#x221E;</text>
    <text x="380" y="400" font-size="34" transform="rotate(8, 380, 400)">&#x2211;</text>
    <text x="140" y="250" font-size="26">&#x222B;</text>
    <text x="370" y="270" font-size="28" transform="rotate(-12, 370, 270)">&#x394;</text>
  </g>

  <!-- Central "N" letterform -->
  <g filter="url(#shadow)">
    <!-- The N shape built from geometric paths -->
    <path d="M 180 170 L 180 342 L 206 342 L 206 220 L 306 342 L 332 342 L 332 170 L 306 170 L 306 292 L 206 170 Z"
          fill="url(#glow)" filter="url(#innerGlow)"/>
  </g>

  <!-- Small decorative dots on the orbital ring -->
  <circle cx="111" cy="200" r="5" fill="#7eb4ff" opacity="0.7"/>
  <circle cx="401" cy="312" r="5" fill="#ff8ec6" opacity="0.7"/>
  <circle cx="200" cy="401" r="4" fill="#b48cff" opacity="0.6"/>
  <circle cx="312" cy="111" r="4" fill="#7eb4ff" opacity="0.6"/>
</svg>
