<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Fraunces';font-weight:600;src:url('../fonts/fraunces-latin-600-normal.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(1000px 800px at 50% 8%, #FBF8F2 0%, #F4EFE6 55%, #EAE3D7 100%);font-family:'Noto Sans',sans-serif;position:relative}
.cap{position:absolute;left:70px;right:70px;top:118px;text-align:center}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:84px;line-height:1.06;color:#2A211B;letter-spacing:-0.01em;text-wrap:balance}
h1 em{font-style:normal;color:#B4552F;white-space:nowrap}
p{margin-top:26px;font-size:38px;line-height:1.3;color:#5A4D42;font-weight:500;text-wrap:balance}
.grid{position:absolute;left:60px;top:432px;display:grid;grid-template-columns:465px 465px;gap:32px 30px}
.t{position:relative;width:465px;height:446px;border-radius:34px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 2px rgba(42,33,27,.10),0 24px 50px rgba(70,45,25,.20),0 6px 16px rgba(70,45,25,.14)}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t span{position:absolute;left:16px;bottom:16px;padding:9px 20px;border-radius:999px;background:rgba(42,33,27,.86);color:#FBF8F2;font:600 25px 'Noto Sans',sans-serif}
</style></head><body>
<div class="cap"><h1>22 labs you can <em>play with</em></h1><p>Rig a map, test a rock, sail for spices</p></div>
<div class="grid">
  <div class="t"><img src="../raw/tiles/era-map.png"><span>Era Map</span></div>
  <div class="t"><img src="../raw/tiles/rock-id.png"><span>Rock ID</span></div>
  <div class="t"><img src="../raw/tiles/cosmic-scale.png"><span>Cosmic Scale</span></div>
  <div class="t"><img src="../raw/tiles/trade-routes.png"><span>Trade Routes</span></div>
  <div class="t"><img src="../raw/tiles/phase-diagram.png"><span>Phase Diagram</span></div>
  <div class="t"><img src="../raw/tiles/molecule-builder.png"><span>Molecule Builder</span></div>
</div>
</body></html>
