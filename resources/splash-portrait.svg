<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a22"/>
      <stop offset="55%" stop-color="#150d36"/>
      <stop offset="100%" stop-color="#3a1a5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="40%" stop-color="#ffd76a"/>
      <stop offset="80%" stop-color="#e8a322"/>
      <stop offset="100%" stop-color="#a86e10"/>
    </linearGradient>
    <linearGradient id="goldSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="50%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86e10" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ff9a30" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1.2">
    <line x1="180" y1="0" x2="180" y2="1920"/>
    <line x1="360" y1="0" x2="360" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="720" y1="0" x2="720" y2="1920"/>
    <line x1="900" y1="0" x2="900" y2="1920"/>
    <line x1="0" y1="240" x2="1080" y2="240"/>
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="720" x2="1080" y2="720"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="0" y1="1680" x2="1080" y2="1680"/>
  </g>

  <g>
    <circle cx="180" cy="280" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="900" cy="320" r="2.4" fill="#ffd76a" opacity="0.85"/>
    <circle cx="980" cy="540" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="120" cy="560" r="2.4" fill="#ffd76a" opacity="0.7"/>
    <circle cx="200" cy="1620" r="2.4" fill="#ffffff" opacity="0.6"/>
    <circle cx="900" cy="1700" r="3" fill="#ffd76a" opacity="0.7"/>
    <circle cx="80" cy="1300" r="2" fill="#ffffff" opacity="0.45"/>
    <circle cx="1000" cy="1380" r="2.4" fill="#ffffff" opacity="0.5"/>
  </g>

  <g transform="translate(540, 800)">
    <circle cx="0" cy="0" r="450" fill="url(#halo)"/>

    <circle cx="0" cy="0" r="380"
            stroke="url(#goldStroke)" stroke-width="6"
            fill="none" opacity="0.65"/>

    <g stroke="url(#goldStroke)" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-410" x2="0" y2="-368" stroke-width="5.5"/>
      <line x1="410" y1="0" x2="368" y2="0" stroke-width="5.5"/>
      <line x1="0" y1="410" x2="0" y2="368" stroke-width="5.5"/>
      <line x1="-410" y1="0" x2="-368" y2="0" stroke-width="5.5"/>

      <line x1="190" y1="-329" x2="178" y2="-298" stroke-width="3" opacity="0.75"/>
      <line x1="329" y1="-190" x2="298" y2="-178" stroke-width="3" opacity="0.75"/>
      <line x1="329" y1="190" x2="298" y2="178" stroke-width="3" opacity="0.75"/>
      <line x1="190" y1="329" x2="178" y2="298" stroke-width="3" opacity="0.75"/>
      <line x1="-190" y1="329" x2="-178" y2="298" stroke-width="3" opacity="0.75"/>
      <line x1="-329" y1="190" x2="-298" y2="178" stroke-width="3" opacity="0.75"/>
      <line x1="-329" y1="-190" x2="-298" y2="-178" stroke-width="3" opacity="0.75"/>
      <line x1="-190" y1="-329" x2="-178" y2="-298" stroke-width="3" opacity="0.75"/>
    </g>

    <circle cx="0" cy="0" r="338"
            stroke="url(#goldStroke)" stroke-width="1.5"
            fill="none" opacity="0.4" stroke-dasharray="4 8"/>

    <g filter="url(#glyphShadow)">
      <text x="0" y="180"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="540"
            font-weight="700"
            fill="url(#gold)"
            text-anchor="middle"
            filter="url(#goldGlow)">Φ</text>
    </g>

    <g>
      <circle cx="-269" cy="-269" r="68" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="4" opacity="0.95"/>
      <text x="-269" y="-258"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="86"
            font-weight="700"
            fill="url(#goldSmall)"
            text-anchor="middle"
            filter="url(#smallGlow)">π</text>
    </g>
    <g>
      <circle cx="269" cy="-269" r="68" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="4" opacity="0.95"/>
      <text x="269" y="-254"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="86"
            font-weight="700"
            font-style="italic"
            fill="url(#goldSmall)"
            text-anchor="middle"
            filter="url(#smallGlow)">e</text>
    </g>
  </g>

  <text x="540" y="1490"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="180"
        font-weight="700"
        fill="url(#title)"
        text-anchor="middle"
        letter-spacing="14"
        filter="url(#textShadow)">PHINE</text>

  <text x="540" y="1580"
        font-family="Georgia, serif"
        font-size="44"
        fill="#e8dcff"
        text-anchor="middle"
        opacity="0.6"
        letter-spacing="6">EXPLORE EVERYTHING</text>
</svg>
