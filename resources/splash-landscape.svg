<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a22"/>
      <stop offset="55%" stop-color="#150d36"/>
      <stop offset="100%" stop-color="#3a1a5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="40%" stop-color="#ffd76a"/>
      <stop offset="80%" stop-color="#e8a322"/>
      <stop offset="100%" stop-color="#a86e10"/>
    </linearGradient>
    <linearGradient id="goldSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="50%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86e10" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ff9a30" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1.2">
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>

  <g>
    <circle cx="200" cy="180" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="1700" cy="200" r="2.4" fill="#ffd76a" opacity="0.85"/>
    <circle cx="1820" cy="450" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="120" cy="450" r="2.4" fill="#ffd76a" opacity="0.7"/>
    <circle cx="180" cy="900" r="2.4" fill="#ffffff" opacity="0.55"/>
    <circle cx="1750" cy="900" r="3" fill="#ffd76a" opacity="0.7"/>
  </g>

  <g transform="translate(640, 540)">
    <circle cx="0" cy="0" r="380" fill="url(#halo)"/>

    <circle cx="0" cy="0" r="320"
            stroke="url(#goldStroke)" stroke-width="5"
            fill="none" opacity="0.65"/>

    <g stroke="url(#goldStroke)" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-345" x2="0" y2="-310" stroke-width="4.6"/>
      <line x1="345" y1="0" x2="310" y2="0" stroke-width="4.6"/>
      <line x1="0" y1="345" x2="0" y2="310" stroke-width="4.6"/>
      <line x1="-345" y1="0" x2="-310" y2="0" stroke-width="4.6"/>

      <line x1="160" y1="-277" x2="150" y2="-251" stroke-width="2.6" opacity="0.75"/>
      <line x1="277" y1="-160" x2="251" y2="-150" stroke-width="2.6" opacity="0.75"/>
      <line x1="277" y1="160" x2="251" y2="150" stroke-width="2.6" opacity="0.75"/>
      <line x1="160" y1="277" x2="150" y2="251" stroke-width="2.6" opacity="0.75"/>
      <line x1="-160" y1="277" x2="-150" y2="251" stroke-width="2.6" opacity="0.75"/>
      <line x1="-277" y1="160" x2="-251" y2="150" stroke-width="2.6" opacity="0.75"/>
      <line x1="-277" y1="-160" x2="-251" y2="-150" stroke-width="2.6" opacity="0.75"/>
      <line x1="-160" y1="-277" x2="-150" y2="-251" stroke-width="2.6" opacity="0.75"/>
    </g>

    <circle cx="0" cy="0" r="285"
            stroke="url(#goldStroke)" stroke-width="1.2"
            fill="none" opacity="0.4" stroke-dasharray="3 6"/>

    <g filter="url(#glyphShadow)">
      <text x="0" y="150"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="450"
            font-weight="700"
            fill="url(#gold)"
            text-anchor="middle"
            filter="url(#goldGlow)">Φ</text>
    </g>

    <g>
      <circle cx="-226" cy="-226" r="58" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="3.5" opacity="0.95"/>
      <text x="-226" y="-216"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="74"
            font-weight="700"
            fill="url(#goldSmall)"
            text-anchor="middle"
            filter="url(#smallGlow)">π</text>
    </g>
    <g>
      <circle cx="226" cy="-226" r="58" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="3.5" opacity="0.95"/>
      <text x="226" y="-213"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="74"
            font-weight="700"
            font-style="italic"
            fill="url(#goldSmall)"
            text-anchor="middle"
            filter="url(#smallGlow)">e</text>
    </g>
  </g>

  <text x="1340" y="540"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="200"
        font-weight="700"
        fill="url(#title)"
        text-anchor="middle"
        letter-spacing="16"
        filter="url(#textShadow)">PHINE</text>

  <text x="1340" y="610"
        font-family="Georgia, serif"
        font-size="42"
        fill="#e8dcff"
        text-anchor="middle"
        opacity="0.6"
        letter-spacing="8">EXPLORE EVERYTHING</text>
</svg>
