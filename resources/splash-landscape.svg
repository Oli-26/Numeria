<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a22"/>
      <stop offset="55%" stop-color="#150d36"/>
      <stop offset="100%" stop-color="#3a1a5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="40%" stop-color="#ffd76a"/>
      <stop offset="80%" stop-color="#e8a322"/>
      <stop offset="100%" stop-color="#a86e10"/>
    </linearGradient>
    <linearGradient id="goldSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="50%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86e10" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ff9a30" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  
    <linearGradient id="nGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="45%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#d98f1c"/>
    </linearGradient>
    <radialGradient id="nHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ff9a30" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="nGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1.2">
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>

  <g>
    <circle cx="200" cy="180" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="1700" cy="200" r="2.4" fill="#ffd76a" opacity="0.85"/>
    <circle cx="1820" cy="450" r="2" fill="#ffffff" opacity="0.5"/>
    <circle cx="120" cy="450" r="2.4" fill="#ffd76a" opacity="0.7"/>
    <circle cx="180" cy="900" r="2.4" fill="#ffffff" opacity="0.55"/>
    <circle cx="1750" cy="900" r="3" fill="#ffd76a" opacity="0.7"/>
  </g>

  <g transform="translate(640 540)"><g transform="scale(1.6)">
    <circle r="200" fill="url(#nHalo)"/>
    <circle r="178" fill="none" stroke="#ffd76a" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
    <g stroke="#ffd76a" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"><line x1="-140" y1="-10" x2="-70" y2="-85"/><line x1="140" y1="10" x2="70" y2="85"/><line x1="10" y1="-145" x2="70" y2="-85"/><line x1="-20" y1="142" x2="-70" y2="85"/></g>
    <g fill="#ffe9a0" opacity="0.9"><circle cx="-140" cy="-10" r="9"/><circle cx="140" cy="10" r="9"/><circle cx="10" cy="-145" r="9"/><circle cx="-20" cy="142" r="9"/></g>
    <g filter="url(#nGlow)">
      <polyline points="-70,85 -70,-85 70,85 70,-85" fill="none" stroke="url(#nGold)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="url(#nGold)"><circle cx="-70" cy="85" r="21"/><circle cx="-70" cy="-85" r="25"/><circle cx="70" cy="85" r="25"/><circle cx="70" cy="-85" r="21"/></g>
      <g fill="#fffbe6"><circle cx="-70" cy="85" r="7"/><circle cx="-70" cy="-85" r="7"/><circle cx="70" cy="85" r="7"/><circle cx="70" cy="-85" r="7"/></g>
    </g>
  </g></g>

  <text x="1340" y="540"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="200"
        font-weight="700"
        fill="url(#title)"
        text-anchor="middle"
        letter-spacing="16"
        filter="url(#textShadow)">NOUS</text>

  <text x="1340" y="610"
        font-family="Georgia, serif"
        font-size="42"
        fill="#e8dcff"
        text-anchor="middle"
        opacity="0.6"
        letter-spacing="8">EXPLORE EVERYTHING</text>
</svg>
