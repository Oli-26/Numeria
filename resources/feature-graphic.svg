<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a22"/>
      <stop offset="50%" stop-color="#150d36"/>
      <stop offset="100%" stop-color="#3a1a5a"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="55%" stop-color="#1a1240"/>
      <stop offset="100%" stop-color="#3a1a5a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="40%" stop-color="#ffd76a"/>
      <stop offset="80%" stop-color="#e8a322"/>
      <stop offset="100%" stop-color="#a86e10"/>
    </linearGradient>
    <linearGradient id="goldSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="50%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86e10" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ff9a30" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="22%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffb846" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#bgGlow)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
    <line x1="0" y1="100" x2="1024" y2="100"/>
    <line x1="0" y1="200" x2="1024" y2="200"/>
    <line x1="0" y1="300" x2="1024" y2="300"/>
    <line x1="0" y1="400" x2="1024" y2="400"/>
  </g>

  <g>
    <circle cx="640" cy="60" r="1.6" fill="#ffffff" opacity="0.6"/>
    <circle cx="780" cy="120" r="2" fill="#ffd76a" opacity="0.7"/>
    <circle cx="900" cy="80" r="1.2" fill="#ffffff" opacity="0.55"/>
    <circle cx="960" cy="200" r="1.6" fill="#ffffff" opacity="0.5"/>
    <circle cx="700" cy="430" r="1.4" fill="#ffffff" opacity="0.5"/>
    <circle cx="850" cy="380" r="2" fill="#ffd76a" opacity="0.7"/>
    <circle cx="970" cy="430" r="1.2" fill="#ffffff" opacity="0.45"/>
    <circle cx="600" cy="350" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="540" cy="80" r="1" fill="#ffffff" opacity="0.4"/>
  </g>

  <g transform="translate(60, 90) scale(0.625)">
    <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#iconBg)" filter="url(#glyphShadow)"/>

    <g opacity="0.045" stroke="#ffffff" stroke-width="1">
      <line x1="112" y1="32" x2="112" y2="480"/>
      <line x1="208" y1="32" x2="208" y2="480"/>
      <line x1="304" y1="32" x2="304" y2="480"/>
      <line x1="400" y1="32" x2="400" y2="480"/>
      <line x1="32" y1="112" x2="480" y2="112"/>
      <line x1="32" y1="208" x2="480" y2="208"/>
      <line x1="32" y1="304" x2="480" y2="304"/>
      <line x1="32" y1="400" x2="480" y2="400"/>
    </g>

    <circle cx="256" cy="256" r="240" fill="url(#halo)"/>

    <circle cx="256" cy="256" r="200"
            stroke="url(#goldStroke)" stroke-width="3.6"
            fill="none" opacity="0.65"/>

    <g stroke="url(#goldStroke)" stroke-linecap="round" opacity="0.7">
      <line x1="256" y1="56" x2="256" y2="78" stroke-width="3"/>
      <line x1="456" y1="256" x2="434" y2="256" stroke-width="3"/>
      <line x1="256" y1="456" x2="256" y2="434" stroke-width="3"/>
      <line x1="56" y1="256" x2="78" y2="256" stroke-width="3"/>

      <line x1="356" y1="83" x2="350" y2="100" stroke-width="1.6" opacity="0.75"/>
      <line x1="429" y1="156" x2="412" y2="162" stroke-width="1.6" opacity="0.75"/>
      <line x1="429" y1="356" x2="412" y2="350" stroke-width="1.6" opacity="0.75"/>
      <line x1="356" y1="429" x2="350" y2="412" stroke-width="1.6" opacity="0.75"/>
      <line x1="156" y1="429" x2="162" y2="412" stroke-width="1.6" opacity="0.75"/>
      <line x1="83" y1="356" x2="100" y2="350" stroke-width="1.6" opacity="0.75"/>
      <line x1="83" y1="156" x2="100" y2="162" stroke-width="1.6" opacity="0.75"/>
      <line x1="156" y1="83" x2="162" y2="100" stroke-width="1.6" opacity="0.75"/>
    </g>

    <circle cx="256" cy="256" r="178"
            stroke="url(#goldStroke)" stroke-width="0.8"
            fill="none" opacity="0.4" stroke-dasharray="2 4"/>

    <g filter="url(#glyphShadow)">
      <text x="256" y="350"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="280"
            font-weight="700"
            fill="url(#gold)"
            text-anchor="middle"
            filter="url(#goldGlow)">Φ</text>
    </g>

    <g>
      <circle cx="117" cy="117" r="36" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="2.2" opacity="0.95"/>
      <text x="117" y="125"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="46"
            font-weight="700"
            fill="url(#goldSmall)"
            text-anchor="middle"
            filter="url(#smallGlow)">π</text>
    </g>
    <g>
      <circle cx="395" cy="117" r="36" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="2.2" opacity="0.95"/>
      <text x="395" y="130"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="46"
            font-weight="700"
            font-style="italic"
            fill="url(#goldSmall)"
            text-anchor="middle"
            filter="url(#smallGlow)">e</text>
    </g>
  </g>

  <text x="400" y="220"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="124"
        font-weight="700"
        fill="url(#title)"
        letter-spacing="10"
        filter="url(#textShadow)">Phine</text>

  <text x="400" y="290"
        font-family="Georgia, serif"
        font-size="26"
        fill="#e8dcff"
        opacity="0.9"
        letter-spacing="1">Three constants. One trinity.</text>
  <text x="400" y="324"
        font-family="Georgia, serif"
        font-size="26"
        fill="#e8dcff"
        opacity="0.9"
        letter-spacing="1">Explore the story of everything.</text>

  <g transform="translate(400, 380)" font-family="Georgia, serif" font-size="22" fill="#fff" text-anchor="middle">
    <circle cx="14" cy="14" r="14" fill="#ffd76a" opacity="0.22"/>
    <text x="14" y="22">Φ</text>
    <circle cx="62" cy="14" r="14" fill="#7eb4ff" opacity="0.22"/>
    <text x="62" y="22">π</text>
    <circle cx="110" cy="14" r="14" fill="#ff8ec6" opacity="0.22"/>
    <text x="110" y="22" font-style="italic">e</text>
  </g>
</svg>
