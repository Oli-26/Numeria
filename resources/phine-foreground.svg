<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="40%" stop-color="#ffd76a"/>
      <stop offset="80%" stop-color="#e8a322"/>
      <stop offset="100%" stop-color="#a86e10"/>
    </linearGradient>
    <linearGradient id="goldSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="100%" stop-color="#c69830"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a86e10" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb846" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#ff9a30" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ffd76a" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>

  <circle cx="256" cy="256" r="180"
          stroke="url(#goldStroke)" stroke-width="3.4"
          fill="none" opacity="0.7"/>

  <g stroke="url(#goldStroke)" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="76" x2="256" y2="96" stroke-width="2.8"/>
    <line x1="436" y1="256" x2="416" y2="256" stroke-width="2.8"/>
    <line x1="256" y1="436" x2="256" y2="416" stroke-width="2.8"/>
    <line x1="76" y1="256" x2="96" y2="256" stroke-width="2.8"/>
  </g>

  <circle cx="256" cy="256" r="160"
          stroke="url(#goldStroke)" stroke-width="0.7"
          fill="none" opacity="0.4" stroke-dasharray="2 4"/>

  <g filter="url(#glyphShadow)">
    <text x="256" y="335"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="240"
          font-weight="700"
          fill="url(#gold)"
          text-anchor="middle"
          filter="url(#goldGlow)">Φ</text>
  </g>

  <g>
    <circle cx="135" cy="135" r="32" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="2" opacity="0.95"/>
    <text x="135" y="142"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="42"
          font-weight="700"
          fill="url(#goldSmall)"
          text-anchor="middle"
          filter="url(#smallGlow)">π</text>
  </g>
  <g>
    <circle cx="377" cy="135" r="32" fill="#0a0e2a" stroke="url(#goldStroke)" stroke-width="2" opacity="0.95"/>
    <text x="377" y="147"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="42"
          font-weight="700"
          font-style="italic"
          fill="url(#goldSmall)"
          text-anchor="middle"
          filter="url(#smallGlow)">e</text>
  </g>
</svg>
